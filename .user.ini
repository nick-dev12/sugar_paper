; Réglages PHP appliqués quand PHP tourne en PHP-FPM / CGI (cas de Webuzo sur le VPS).
; Remplace les directives php_value qui ne fonctionnent qu'en mod_php (.htaccess).
;
; La config session détaillée est déjà faite via includes/session_user.php
; + session_start_persistent() sur chaque page.
session.gc_maxlifetime = 2592000
session.cookie_lifetime = 2592000
upload_max_filesize = 200M
post_max_size = 200M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
