# Exemple Nginx — proxy WebSocket Socket.io vers Node.js
# Webuzo : /var/webuzo-data/nginx/custom/domains/DOMAIN.conf
#
# Si le websocket échoue encore, ajoutez dans la conf Nginx globale (http {}) :
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
# puis remplacez Connection "upgrade" par Connection $connection_upgrade

location /socket.io/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}
